[project]
name = "lunar-calc"
version = "1.0.0"
description = "A CLI tool for converting between Gregorian and Chinese Lunar calendar birthdays with astrological details"
readme = "README.md"
license = "MIT"
authors = [{name = "frndvrgs", email = "frndvrgs@gmail.com"}]
requires-python = ">=3.10"
dependencies = [
    "lunar-python>=1.4.0",
    "questionary>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "poethepoet>=0.40.0",
    "mypy>=1.20.0",
]

[project.scripts]
lunar-calc = "lunar_calc.__main__:main"

[project.urls]
Repository = "https://github.com/frndvrgs/lunar-calc"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]
ignore = [
    "E501",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.poe.tasks]
start = "lunar-calc"
check = "ruff check ."
format = "ruff format ."
"check:fix" = "ruff check --fix ."
typecheck = "mypy src/"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
