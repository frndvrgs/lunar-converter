[project]
name = "lunar-calc"
version = "1.0.0"
description = "A CLI tool for converting between Gregorian and Chinese Lunar calendar birthdays with astrological details"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "lunar-python>=1.4.0",
    "questionary>=2.0.0",
]

[project.scripts]
lunar-calc = "lunar_calc.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
